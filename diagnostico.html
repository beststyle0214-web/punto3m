<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de conexión · Punto 3 M</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; line-height: 1.5; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.3rem; }
    .caja { background: #1e293b; border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
    .ok { color: #34d399; } .mal { color: #f87171; } .esp { color: #fbbf24; }
    code { font-size: .8rem; color: #94a3b8; word-break: break-all; }
    button { background: #4f46e5; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 1rem; font-weight: 700; }
  </style>
</head>
<body>
<main>
  <h1>🔧 Prueba de conexión</h1>
  <p>Esta página comprueba, paso a paso, si tu teléfono puede hablar con Firebase <b>sin VPN</b>.</p>
  <p><button id="ir">Empezar la prueba</button></p>
  <div id="salida"></div>

  <h2 style="font-size:1.1rem;margin-top:28px">🔬 Prueba avanzada (datos reales)</h2>
  <p style="font-size:.9rem">Sirve para ver por qué <b>no se sincroniza</b> sin VPN. Escribe tu correo y contraseña de siempre (no se guardan). Tarda ~1 minuto.</p>
  <p><input id="av-correo" type="email" placeholder="Correo" autocomplete="username" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:0;margin-bottom:8px">
  <input id="av-clave" type="password" placeholder="Contraseña" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:0"></p>
  <p><button id="av-ir">Empezar prueba avanzada</button></p>
  <div id="salida2"></div>
  <p><a href="./" style="color:#a5b4fc">← Volver a Punto 3 M</a></p>
</main>
<script type="module">
  import { firebaseConfig, PROXY_URL } from './config.js';
  const salida = document.getElementById('salida');
  const proxy = (PROXY_URL || '').trim().replace(/\/+$/, '');

  function fila(texto) {
    const d = document.createElement('div');
    d.className = 'caja';
    d.innerHTML = `<span class="esp">⏳</span> ${texto}`;
    salida.appendChild(d);
    return (clase, simbolo, detalle) => {
      d.innerHTML = `<span class="${clase}">${simbolo}</span> ${texto}${detalle ? `<br><code>${detalle}</code>` : ''}`;
    };
  }

  async function llamar(url, opciones = {}) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(url, { ...opciones, signal: ctl.signal });
      const cuerpo = (await r.text()).slice(0, 140).replace(/\s+/g, ' ');
      return { estado: r.status, cuerpo };
    } finally {
      clearTimeout(t);
    }
  }

  async function probar() {
    salida.innerHTML = '';
    if (!proxy) {
      fila('Esta versión de la app todavía <b>no tiene configurado el intermediario</b> (PROXY_URL vacío).')('mal', '❌');
      return;
    }
    fila(`Intermediario configurado: <code>${proxy}</code>`)('ok', '✅');

    let f = fila('1. ¿Abre el intermediario de Cloudflare?');
    try {
      const r = await llamar(`${proxy}/ping`);
      r.estado === 200 ? f('ok', '✅', r.cuerpo) : f('mal', '❌', `Respuesta ${r.estado}: ${r.cuerpo}`);
    } catch (e) {
      f('mal', '❌', `No se pudo conectar (${e.name}). Revisa la dirección o la señal.`);
      return;
    }

    f = fila('2. ¿Llega al inicio de sesión de Google (a través del intermediario)?');
    try {
      const r = await llamar(`${proxy}/identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${firebaseConfig.apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: 'prueba@ejemplo.com', password: 'x', returnSecureToken: true }),
      });
      // Google contesta 400 con un mensaje JSON (correo o clave incorrectos): eso es BUENO, llegó a Google.
      /"error"/.test(r.cuerpo) && r.estado !== 403
        ? f('ok', '✅', `Google respondió (${r.estado}): ${r.cuerpo}`)
        : f('mal', '❌', `Respuesta ${r.estado}: ${r.cuerpo}`);
    } catch (e) {
      f('mal', '❌', `Falló (${e.name}).`);
    }

    f = fila('3. ¿Llega a la base de datos de Google (a través del intermediario)?');
    try {
      const r = await llamar(`${proxy}/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/config/general?key=${firebaseConfig.apiKey}`);
      // Sin sesión, Google contesta 401/403 con JSON "PERMISSION_DENIED"/"UNAUTHENTICATED": también es BUENO.
      /PERMISSION_DENIED|UNAUTHENTICATED|"error"/.test(r.cuerpo) && !/<html/i.test(r.cuerpo)
        ? f('ok', '✅', `Google respondió (${r.estado}): ${r.cuerpo}`)
        : f('mal', '❌', `Respuesta ${r.estado}: ${r.cuerpo}`);
    } catch (e) {
      f('mal', '❌', `Falló (${e.name}).`);
    }

    fila('Si los 3 pasos salieron ✅, ya puedes entrar a Punto 3 M <b>sin VPN</b>.')('ok', '🎉');
  }

  document.getElementById('ir').addEventListener('click', probar);

  // ------------------------------------------------ prueba avanzada con el SDK real de Firebase
  const salida2 = document.getElementById('salida2');
  function fila2(texto) {
    const d = document.createElement('div');
    d.className = 'caja';
    d.innerHTML = `<span class="esp">⏳</span> ${texto}`;
    salida2.appendChild(d);
    return (clase, simbolo, detalle) => {
      d.innerHTML = `<span class="${clase}">${simbolo}</span> ${texto}${detalle ? `<br><code>${detalle}</code>` : ''}`;
    };
  }
  const cargarScript = (src) =>
    new Promise((ok, mal) => {
      const el = document.createElement('script');
      el.src = src;
      el.onload = ok;
      el.onerror = () => mal(new Error('no cargó ' + src));
      document.head.appendChild(el);
    });
  const conLimite = (p, ms, nombre) =>
    Promise.race([p, new Promise((_, r) => setTimeout(() => r(Object.assign(new Error('tiempo agotado'), { code: 'tiempo-agotado:' + nombre })), ms))]);
  const alcanzoGoogle = (e) => e && ['permission-denied', 'unauthenticated'].includes(e.code);

  const VARIANTES = [
    ['A. Peticiones normales (long polling forzado) — lo que usa la app ahora', { experimentalForceLongPolling: true }],
    ['B. Flujo directo (streaming del navegador)', {}],
    ['C. Automático', { experimentalAutoDetectLongPolling: true }],
  ];

  async function pruebaAvanzada() {
    salida2.innerHTML = '';
    const correo = document.getElementById('av-correo').value.trim();
    const clave = document.getElementById('av-clave').value;
    if (!proxy) return fila2('Falta PROXY_URL')('mal', '❌');
    if (!correo || !clave) return fila2('Escribe tu correo y contraseña arriba.')('mal', '❌');
    let f = fila2('Cargando el SDK de Firebase');
    try {
      const base = 'https://www.gstatic.com/firebasejs/10.8.0/';
      await cargarScript(base + 'firebase-app-compat.js');
      await Promise.all([cargarScript(base + 'firebase-auth-compat.js'), cargarScript(base + 'firebase-firestore-compat.js')]);
      f('ok', '✅');
    } catch (e) {
      return f('mal', '❌', e.message);
    }
    // Prueba directa del canal de Firestore a través del intermediario (sin SDK)
    f = fila2('Canal de Firestore: pedir una conexión a Google a través del intermediario');
    try {
      const url = `${proxy}/google.firestore.v1.Firestore/Listen/channel?database=${encodeURIComponent(`projects/${firebaseConfig.projectId}/databases/(default)`)}&VER=8&RID=1&CVER=22&X-HTTP-Session-Id=gsessionid&zx=prueba&t=1`;
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'count=0', signal: ctl.signal });
      clearTimeout(t);
      const cuerpo = (await r.text()).slice(0, 160).replace(/\s+/g, ' ');
      f(r.status < 500 ? 'ok' : 'mal', r.status < 500 ? '✅' : '❌', `HTTP ${r.status} · ${r.headers.get('content-type') || 'sin tipo'} · ${cuerpo}`);
    } catch (e) {
      f('mal', '❌', `${e.name}: ${e.message}`);
    }

    // Guarda lo que cuenta el SDK sobre su conexión para mostrar el motivo real
    const registro = [];
    firebase.setLogLevel('debug');
    for (const m of ['log', 'info', 'warn', 'error', 'debug']) {
      const original = console[m].bind(console);
      console[m] = (...args) => {
        try { registro.push(args.map((x) => (typeof x === 'string' ? x : x && x.message ? x.message : JSON.stringify(x))).join(' ').slice(0, 220)); } catch (e) { /* nada */ }
        original(...args);
      };
    }
    for (const [nombre, ajustes] of VARIANTES) {
      fila2(`<b>${nombre}</b>`)('esp', '▶️');
      const app = firebase.initializeApp(firebaseConfig, 'v' + Math.random().toString(36).slice(2));
      try {
        const auth = app.auth();
        auth.useEmulator(proxy, { disableWarnings: true });
        let t0 = Date.now();
        f = fila2('Iniciar sesión');
        try {
          await conLimite(auth.signInWithEmailAndPassword(correo, clave), 15000, 'login');
          f('ok', '✅', `${Date.now() - t0} ms`);
        } catch (e) {
          f('mal', '❌', `${e.code || e.name}: ${e.message}`.slice(0, 160));
          continue;
        }
        const db = app.firestore();
        db.settings({ host: new URL(proxy).host, ssl: true, ignoreUndefinedProperties: true, ...ajustes });
        t0 = Date.now();
        f = fila2('Leer un dato directo del servidor');
        try {
          await conLimite(db.collection('config').doc('general').get({ source: 'server' }), 15000, 'leer');
          f('ok', '✅', `${Date.now() - t0} ms`);
        } catch (e) {
          alcanzoGoogle(e) ? f('ok', '✅', `Llegó a Google (${e.code}) en ${Date.now() - t0} ms`) : f('mal', '❌', `${e.code || e.name}: ${(e.message || '').slice(0, 120)}`);
        }
        t0 = Date.now();
        f = fila2('Recibir cambios en vivo (espera hasta 15 s)');
        await new Promise((fin) => {
          const parar = db.collection('config').doc('general').onSnapshot(
            { includeMetadataChanges: true },
            (snap) => {
              if (!snap.metadata.fromCache) {
                f('ok', '✅', `Datos del servidor en ${Date.now() - t0} ms`);
                parar();
                fin();
              }
            },
            (e) => {
              alcanzoGoogle(e) ? f('ok', '✅', `Llegó a Google (${e.code})`) : f('mal', '❌', `${e.code}: ${(e.message || '').slice(0, 120)}`);
              fin();
            },
          );
          setTimeout(() => {
            f('mal', '❌', 'Sin respuesta del servidor en 15 s (solo se vio la copia guardada).');
            parar();
            fin();
          }, 15000);
        });
      } finally {
        const utiles = registro.filter((l) => /webchannel|stream|transport|error|offline|fail|closed|rpc/i.test(l));
        if (utiles.length) fila2('Lo que dice el SDK (últimas líneas)')('esp', '📜', utiles.slice(-8).join('<br>').replace(/</g, '&lt;').replace(/&lt;br>/g, '<br>'));
        registro.length = 0;
        try { await app.delete(); } catch (e) { /* nada */ }
      }
    }
    fila2('Fin. Haz captura de toda esta sección y mándamela.')('ok', '🏁');
  }
  document.getElementById('av-ir').addEventListener('click', pruebaAvanzada);
</script>
</body>
</html>
